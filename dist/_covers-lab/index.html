<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>封面小样 · 三个项目各三种</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/styles.css">
<style>
body{background:#F3F5F4}
.lab{max-width:1320px;margin:0 auto;padding:48px 32px 96px}
.lab h1{font-size:28px;margin:0 0 8px}
.lab>p{color:#4a5a55;margin:0 0 40px;max-width:60em}
.lab h2{font-size:22px;margin:56px 0 18px;display:flex;align-items:center;gap:10px}
.lab h2::before{content:'';width:12px;height:12px;border-radius:3px;background:var(--c)}
.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.opt{margin:0}
.opt>figcaption{margin-top:12px;font-size:15px;line-height:1.5;color:#4a5a55}
.opt>figcaption b{display:block;color:#111;font-size:16px;margin-bottom:2px}
.lab .collage{container-type:inline-size}
@media (max-width:900px){.row{grid-template-columns:1fr}.lab{padding:28px 16px 64px}}

/* 共用：封面上的小标签和标题 */
.k-chips{display:flex;flex-wrap:wrap;gap:1cqw}
.k-chip{font:600 max(9px,1.7cqw)/1 var(--mono, ui-monospace, monospace);padding:.9cqw 1.4cqw;border-radius:99px;letter-spacing:.02em}
.k-title{font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:0}
.k-sub{margin:0;font-weight:500}
.k-phone{position:absolute;display:block;height:auto;border-radius:2.4cqw;background:#fff;
  box-shadow:0 0 0 .5cqw #fff,0 0 0 .62cqw rgba(0,0,0,.08),0 2.4cqw 5cqw rgba(10,30,40,.22)}

/* ===== 兴业 SMT ===== */
/* S1 设计中心卡片：浅蓝底 + 玻璃 3D 图标 */
.smt-card{background:linear-gradient(120deg,#FFFFFF 0%,#EEF5FF 45%,#D6E8FD 100%)}
.smt-card .k-chips{position:absolute;left:6cqw;top:7cqw}
.smt-card .k-chip:nth-child(1){background:#E3ECFF;color:#3557E8}
.smt-card .k-chip:nth-child(2){background:#E5F6EE;color:#1C8A5A}
.smt-card .k-chip:nth-child(3){background:#FFF0E0;color:#C46A12}
.smt-card .k-title{position:absolute;left:6cqw;top:15.5cqw;font-size:7.4cqw;color:#0E1830}
.smt-card .k-sub{position:absolute;left:6cqw;top:25.5cqw;font-size:2.5cqw;color:#4A5878;max-width:40cqw}
.smt-card .smt-icon{position:absolute;right:1cqw;bottom:-2cqw;width:50cqw;height:auto;
  -webkit-mask:radial-gradient(closest-side,#000 72%,transparent 100%);mask:radial-gradient(closest-side,#000 72%,transparent 100%)}
.smt-card .smt-credit{position:absolute;left:6cqw;bottom:6.5cqw;display:flex;align-items:center;gap:1.2cqw;font-size:1.9cqw;color:#4A5878}
.smt-card .smt-credit i{width:3.6cqw;height:3.6cqw;border-radius:50%;background:#4E71FF;color:#fff;font:700 1.7cqw/3.6cqw system-ui;text-align:center;font-style:normal}
/* S2 同一种卡片 + 真界面露出一角 */
.smt-card2{background:linear-gradient(160deg,#FFFFFF 0%,#EEF5FF 55%,#D6E8FD 100%)}
.smt-card2 .k-chips{position:absolute;left:6cqw;top:6.5cqw}
.smt-card2 .k-chip{background:#fff;color:#3557E8;box-shadow:0 0 0 1px #D8E3FA}
.smt-card2 .k-title{position:absolute;left:6cqw;top:13.5cqw;font-size:6.2cqw;color:#0E1830}
.smt-card2 .smt-icon{position:absolute;right:2cqw;top:-1cqw;width:30cqw;height:auto;
  -webkit-mask:radial-gradient(closest-side,#000 70%,transparent 100%);mask:radial-gradient(closest-side,#000 70%,transparent 100%)}
.smt-card2 .smt-win{position:absolute;left:6cqw;right:-8cqw;top:28cqw;border-radius:1.4cqw 1.4cqw 0 0;overflow:hidden;background:#1E1E1E;
  box-shadow:0 0 0 1px rgba(14,24,48,.12),0 2cqw 5cqw rgba(30,60,140,.25)}
.smt-card2 .smt-win::before{content:'';display:block;height:2.6cqw;background:#2B2B2B;
  background-image:radial-gradient(circle at 2cqw 50%,#FF5F57 .55cqw,transparent .6cqw),radial-gradient(circle at 3.8cqw 50%,#FEBC2E .55cqw,transparent .6cqw),radial-gradient(circle at 5.6cqw 50%,#28C840 .55cqw,transparent .6cqw)}
.smt-card2 .smt-win img{position:static;display:block;width:100%;height:auto;border-radius:0;box-shadow:none}

/* ===== 冰箱 ===== */
/* F1 生成插画铺底 + 真原型 */
.cf-ill{background:#F3E7D1}
.cf-ill .cf-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:100% 50%}
.cf-ill .k-chips{position:absolute;left:5cqw;top:6cqw}
.cf-ill .k-chip{background:#264846;color:#F3E7D1}
.cf-ill .k-phone{left:9cqw;top:12cqw;width:21cqw;transform:rotate(-4deg)}
/* F2 黏土冰箱 + 真原型 + 企鹅 */
.cf-clay{background:#EEE1CF}
.cf-clay .cf-bg{position:absolute;left:-6cqw;top:0;height:100%;width:auto}
.cf-clay .k-phone{right:5cqw;top:6cqw;width:19cqw;transform:rotate(3deg)}
.cf-clay .cf-peng{position:absolute;left:3cqw;bottom:3cqw;width:12cqw;height:auto;
  filter:drop-shadow(0 0 .35cqw #fff) drop-shadow(0 0 .35cqw #fff) drop-shadow(0 .8cqw 1.2cqw rgba(0,0,0,.18));transform:rotate(-8deg)}

/* ===== 青桔 ===== */
/* Q1 生成地图插画铺底 + 两屏立着 */
.qj-map{background:#BFE8CF}
.qj-map .qj-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.qj-map .qj-bg+.qj-veil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(207,243,234,.0) 30%,rgba(207,243,234,.55) 100%)}
.qj-map .k-phone{width:22cqw;top:5cqw;border-radius:2.2cqw}
.qj-map .p1{right:29cqw;transform:rotate(-3deg)}
.qj-map .p2{right:5cqw;top:8cqw;transform:rotate(3deg)}
/* Q2 黏土宝箱 + 一屏 */
.qj-clay{background:#B8E5C3}
.qj-clay .qj-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:100% 50%}
.qj-clay .k-phone{left:7cqw;top:4.5cqw;width:25cqw;transform:rotate(-2deg)}
/* Q3 应用商店截图条：三屏立着，每屏上面一句大字 */
.qj-store{background:linear-gradient(180deg,#10D0B0 0%,#0BB89B 100%)}
.qj-strip{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:3cqw;padding:4.5cqw 6cqw 0}
.qj-store figure{margin:0;display:flex;flex-direction:column;align-items:center;min-width:0}
.qj-store figcaption{color:#fff;font-weight:800;font-size:3cqw;line-height:1.2;text-align:center;margin-bottom:2.6cqw;letter-spacing:-.01em}
.qj-store figcaption small{display:block;font-weight:600;font-size:1.8cqw;opacity:.85;margin-top:.6cqw}
.qj-store img{position:static;width:100%;height:auto;border-radius:2.2cqw;box-shadow:0 0 0 .5cqw #fff,0 2cqw 4cqw rgba(0,60,50,.3)}
</style>
</head>
<body>
<main class="lab">
<h1>封面小样：三个项目，各三种</h1>
<p>每张小样都是首页封面的实际比例。插画和 3D 图标是 Figma AI 生成的，只当装饰；界面截图都是原图，只裁切、缩放，没改颜色和内容。每个项目挑一张，或者说哪张可以再往哪个方向改。</p>

<h2 style="--c:#4E71FF">兴业 SMT</h2>
<div class="row">
 <figure class="opt">
  <div class="collage smt-card">
   <div class="k-chips"><span class="k-chip">2022–23</span><span class="k-chip">桌面端</span><span class="k-chip">组件与规范</span></div>
   <p class="k-title">兴业 SMT</p>
   <p class="k-sub">从业务单元，建立界面秩序</p>
   <div class="smt-credit"><i>冯</i>组件设计、使用规范与维护</div>
   <img class="smt-icon" src="/assets/work/gen/smt-icon-window.webp" width="900" height="900" alt="">
  </div>
  <figcaption><b>S1 · 设计中心项目卡</b>照你发的那张来做：浅蓝底、彩色小标签、大标题、右边一个玻璃质感的 3D 图标（交易窗口 + K 线）。不放界面截图。</figcaption>
 </figure>
 <figure class="opt">
  <div class="collage smt-card2">
   <div class="k-chips"><span class="k-chip">2022–23</span><span class="k-chip">桌面端</span><span class="k-chip">组件与规范</span></div>
   <p class="k-title">兴业 SMT</p>
   <img class="smt-icon" src="/assets/work/gen/smt-icon-blocks.webp" width="900" height="900" alt="">
   <div class="smt-win"><img src="/assets/work/smt/screen-asset-home.webp" width="1920" height="1080" alt="SMT-MAX 资产首页"></div>
  </div>
  <figcaption><b>S2 · 项目卡 + 真界面露一角</b>同一种卡片，图标换成「一摞组件积木」；下半截露出真实的资产首页，让人一眼知道是什么产品。</figcaption>
 </figure>
 <figure class="opt">
  <div class="collage collage--bento" style="--bg:#0E1830"><figure class="bento__tile " style="grid-area:a"><img style="left:0;top:0;width:165%" src="/assets/work/smt/screen-asset-home.webp" width="1920" height="1080" alt="SMT-MAX 资产首页"><figcaption class="bento__label">资产首页</figcaption></figure><figure class="bento__tile " style="grid-area:b"><img style="left:0;top:-9%;width:250%" src="/assets/work/smt/screen-quick-order.webp" width="1920" height="1080" alt="SMT-MAX 快速挂单"><figcaption class="bento__label">快速挂单</figcaption></figure><figure class="bento__tile " style="grid-area:c"><img style="left:0;top:0;width:175%" src="/assets/work/smt/level-variants.webp" width="1510" height="842" alt="买卖档位的 8 个变体"><figcaption class="bento__label">档位 · 8 个变体</figcaption></figure><figure class="bento__tile" style="grid-area:d"><img style="left:-4%;top:6%;width:190%" src="/assets/work/smt/trade-components.webp" width="1797" height="1300" alt="交易组件"><figcaption class="bento__label">交易组件</figcaption></figure></div>
  <figcaption><b>S3 · 拼格（上一版去掉关怀版）</b>上一版的四格，关怀版那格换成交易组件。留着做对照。</figcaption>
 </figure>
</div>

<h2 style="--c:#264846">The Commons Fridge</h2>
<div class="row">
 <figure class="opt">
  <div class="collage cf-ill">
   <img class="cf-bg" src="/assets/work/gen/cf-door.webp" width="1200" height="800" alt="">
   <div class="k-chips"><span class="k-chip">硕士毕业设计</span><span class="k-chip">NFC 入口</span></div>
      <img class="k-phone" src="/assets/work/fridge/cf-home.webp" width="480" height="1062" alt="Commons Fridge 原型首页">
  </div>
  <figcaption><b>F1 · 插画铺底 + 真原型</b>生成的插画：贴满冰箱贴的共享冰箱门，一只手拿手机碰门上的小贴片。左边留白立一屏原型首页。</figcaption>
 </figure>
 <figure class="opt">
  <div class="collage cf-clay">
   <img class="cf-bg" src="/assets/work/gen/cf-clay.webp" width="1200" height="800" alt="">
   <img class="k-phone" src="/assets/work/fridge/cf-found.webp" width="480" height="1062" alt="原型：找到一样东西">
   <img class="cf-peng" src="/assets/work/fridge/penguin-add.webp" width="240" height="243" alt="">
  </div>
  <figcaption><b>F2 · 黏土冰箱 + 原型 + 企鹅</b>生成的黏土风冰箱，每样东西挂着一张小标签（对应「东西是谁的」）。右边立一屏原型，小企鹅当贴纸。</figcaption>
 </figure>
 <figure class="opt">
  <div class="collage collage--scrap" style="--bg:#EFE9DC"><figure class="scrap__snap" style="left:4%;top:13%;width:51%;--r:-4deg"><span class="scrap__tape" aria-hidden="true"></span><img style="aspect-ratio:4/3;object-position:50% 40%" src="/assets/work/fridge/photo-fridge.webp" width="2000" height="1500" alt="我在共享冰箱前演示手机原型"><figcaption>在共享冰箱前</figcaption></figure><figure class="scrap__snap" style="left:51%;top:19%;width:24%;--r:5deg"><span class="scrap__tape" aria-hidden="true"></span><img style="aspect-ratio:3/4;object-position:45% 55%" src="/assets/work/fridge/photo-touch.webp" width="1400" height="1867" alt="碰一下冰箱门上的入口"><figcaption>碰一下就打开</figcaption></figure><img src="/assets/work/fridge/cf-home.webp" width="480" height="1062" alt="Commons Fridge 原型首页" class="scrap__phone collage__phone"><img src="/assets/work/fridge/penguin-add.webp" width="240" height="243" alt="小企鹅贴纸" class="scrap__sticker"></div>
  <figcaption><b>F3 · 手账拼贴（上一版）</b>上一版没改，实拍照片带白边和胶带。留着做对照。</figcaption>
 </figure>
</div>

<h2 style="--c:#10D0B0">青桔</h2>
<div class="row">
 <figure class="opt">
  <div class="collage qj-map">
   <img class="qj-bg" src="/assets/work/gen/qj-map.webp" width="1200" height="800" alt=""><div class="qj-veil"></div>
   <img class="k-phone p1" src="/assets/work/qingju/hifi-phone-map.webp" width="400" height="865" alt="寻宝地图：美景">
   <img class="k-phone p2" src="/assets/work/qingju/hifi-phone-discussion.webp" width="400" height="863" alt="路线讨论圈">
  </div>
  <figcaption><b>Q1 · 插画地图 + 两屏立着</b>生成的公园骑行地图（虚线路线、三个宝箱）铺底，上面立两屏真界面：寻宝地图和路线讨论圈。手机正着放，看得清。</figcaption>
 </figure>
 <figure class="opt">
  <div class="collage qj-clay">
   <img class="qj-bg" src="/assets/work/gen/qj-clay.webp" width="1200" height="800" alt="">
   <img class="k-phone" src="/assets/work/qingju/hifi-phone-map.webp" width="400" height="865" alt="寻宝地图：美景">
  </div>
  <figcaption><b>Q2 · 黏土单车 + 宝箱 + 一屏</b>生成的黏土风：青绿单车停在装满金币的宝箱旁边。左边立一屏寻宝地图。</figcaption>
 </figure>
 <figure class="opt">
  <div class="collage qj-store"><div class="qj-strip">
   <figure><figcaption>按美景找宝箱<small>寻宝地图</small></figcaption><img src="/assets/work/qingju/hifi-phone-map.webp" width="400" height="865" alt="寻宝地图：美景"></figure>
   <figure><figcaption>按美食找宝箱<small>寻宝地图</small></figcaption><img src="/assets/work/qingju/hifi-phone-food.webp" width="317" height="756" alt="寻宝地图：美食"></figure>
   <figure><figcaption>骑完聊路线<small>路线讨论圈</small></figcaption><img src="/assets/work/qingju/hifi-phone-discussion.webp" width="400" height="863" alt="路线讨论圈"></figure>
  </div></div>
  <figcaption><b>Q3 · 应用商店截图条</b>像 App Store 的介绍图：青桔绿底，三屏并排立着，每屏上面一句大字说它是干什么的。不用生成图。</figcaption>
 </figure>
</div>
</main>
</body>
</html>
