<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>审核中心</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2318181b'/%3E%3Cpath d='M9 17l5 5 9-11' stroke='%23ffffff' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body data-view="list">
<!-- 顶栏：通栏，左边是标识。计数、搜索、深浅色都在侧栏里（2026-11-16 重构第一批） -->
<header class="top">
  <span class="mark" aria-hidden="true">✓</span>
  <div class="brand">审核中心</div>
  <!-- 两个入口（2026-11-18 进度页简版）：待你处理（原来的首页，带数字）、进度。哪个亮着由 body[data-view] 定。
       顶栏 B（卡 20261118-016，过渡版）：宽屏是顶栏正中一个分段切换；手机上不放这里，改成底部的 Tab 栏（#tabbar，卡 20261120-003） -->
  <nav class="topnav" id="topnav" aria-label="看哪一页">
    <a href="#/" data-tab="queue">待你处理<b id="n-top">0</b></a>
    <a href="#/progress" data-tab="progress">进度</a>
  </nav>
  <div class="summary" id="summary"></div>
  <!-- 顶栏最右：深浅色（宽窄屏常驻）、退出登录（宽屏登录态常驻，进度页和侧栏收起时也能用） -->
  <button class="icon-btn top-theme" data-theme-btn aria-label="切换深浅色" title="切换深浅色"></button>
  <button class="icon-btn top-logout" id="top-logout" aria-label="退出登录" title="退出登录" hidden></button>
</header>

<!-- 窄屏（手机、桌面 App 的浏览器窗格）看单张卡时的顶栏：回队列、第几张、下一张 -->
<nav class="cardnav" id="cardnav" aria-label="卡片导航">
  <button id="nav-back">‹ 队列</button>
  <span class="pos" id="nav-pos"></span>
  <button id="nav-next">下一张 ›</button>
</nav>

<!-- 看卡时点「还剩 N 张」展开的小列表（卡 20261121-005）：J / K 走的那串卡，位置由 app.js 按按钮算。只在电脑上有，手机上不弹（卡 20261121-007 用户批注） -->
<div class="qpeek" id="qpeek" role="dialog" aria-label="待你处理" hidden></div>

<!-- 电脑上的左边菜单（2026-11-20 卡 20261120-016 选 A，照 Tideline 预览版）：搜索、待你处理 / 已处理 / 项目进度、项目（点了去进度页）、底下深浅色。
     能收起：收起后鼠标移到最左边、或点左上角的按钮浮出来。手机上不显示（手机还是队列一页、单张卡一页） -->
<aside class="menu" id="menu" aria-label="主导航">
  <div class="m-brand">
    <a class="m-home" href="#/"><span class="mark" aria-hidden="true">✓</span><span>审核中心</span></a>
    <button class="icon-btn" id="side-pin"></button>
  </div>
  <div class="m-search" id="m-search"></div>
  <nav class="m-nav" id="m-nav" aria-label="看哪一页">
    <a href="#/" data-nav="pending"><span class="m-ic" id="m-ic-q"></span><span class="m-t">待你处理</span><b id="m-n-pending">0</b></a>
    <a href="#/done" data-nav="done"><span class="m-ic" id="m-ic-d"></span><span class="m-t">已处理</span><b id="m-n-done">0</b></a>
    <a href="#/progress" data-nav="progress"><span class="m-ic" id="m-ic-p"></span><span class="m-t">项目进度</span></a>
  </nav>
  <div class="m-sec">项目</div>
  <div class="m-projs" id="m-projs"></div>
  <!-- 菜单底（电脑）：深浅色、快捷键、退出登录。手机上不显示 -->
  <div class="side-foot" id="filters">
    <button class="icon-btn" id="theme" data-theme-btn aria-label="切换深浅色" title="切换深浅色"></button>
    <details class="keys">
      <summary class="icon-btn" id="keys-ic" aria-label="快捷键" title="快捷键"></summary>
      <div class="keys-grid">
        <kbd>J / K</kbd><span>上一张、下一张</span>
        <kbd>← / →</kbd><span>连拍换一帧</span>
        <kbd>1–9</kbd><span>选方案</span>
        <kbd>↵</kbd><span>通过</span>
        <kbd>R</kbd><span>打回</span>
        <kbd>S</kbd><span>稍后再看</span>
        <kbd>P</kbd><span>看大图时在图上批注</span>
      </div>
    </details>
    <button class="btn sm quiet" id="logout" hidden>退出登录</button>
  </div>
</aside>
<!-- 菜单收起时左上角的按钮：点了固定回来，鼠标停在上面先浮出来看一眼 -->
<button class="icon-btn side-toggle" id="side-toggle" aria-controls="menu"></button>

<main>
  <!-- 菜单收起时，屏幕最左边这一窄条：鼠标移上来（或点一下）菜单就浮出来 -->
  <div class="side-edge" id="side-edge" aria-hidden="true"></div>
  <!-- 卡片列表：一个项目一组，下面直接挂它的卡片。窄屏上它就是「队列」那一页（顶上搜索和三个标签页）；
       电脑上是左边菜单右边的那一页（待你处理；已处理时画成时间线），点开一张卡时整页换成卡片，搜索框挪到菜单里 -->
  <aside class="queue" id="queue" aria-label="卡片，按项目排">
    <!-- 电脑上这里是中间那一页的标题（待你处理 / 已处理），手机上不显示 -->
    <div class="lp-head" id="lp-head"></div>
    <div class="side-top">
      <div class="qsearch"><input type="search" id="f-q" placeholder="搜标题、agent、项目" aria-label="搜标题、agent、项目"><kbd class="q-kbd" aria-hidden="true">/</kbd></div>
      <div class="chips" id="chips" role="group" aria-label="看哪些卡">
        <button class="chip on" data-f="pending">待你处理<b id="n-pending">0</b></button>
        <button class="chip" data-f="done">已处理<b id="n-done">0</b></button>
        <button class="chip" data-f="all">全部<b id="count">0</b></button>
      </div>
    </div>
    <div class="qlist" id="qlist"></div>
    <!-- 手机：退出登录放在队列最下面，不起眼；只在登录了的时候出现 -->
    <div class="q-foot" id="q-foot" hidden><button id="q-logout">退出登录</button></div>
  </aside>
  <section class="card" id="card">
    <div class="welcome">
      <h2>还没选卡片</h2>
      <p>每张卡都会先告诉你：要你做什么、为什么走到这一步、看哪里、选了以后会怎样。</p>
      <p>图可以点开放大，在图上点一下就能钉一条批注，agent 会连坐标一起读到。</p>
      <p>你点的结论（通过、打回、选 A……）会写回卡片，提卡的 agent 用 <code>review.py wait</code> 读到后接着做，做完会在卡上写「后来」。</p>
    </div>
  </section>
</main>

<!-- 进度页（#/progress 总览，#/progress/<项目> 一个项目）：只在 body[data-view="progress"] 时显示，内容由 app.js 的 renderProgress 画 -->
<section class="progress" id="progress" aria-label="进度"></section>

<!-- 手机底部 Tab 栏（卡 20261120-003）：待处理、进度两页；看单张卡时不显示。哪个亮着、红点由 app.js 的 markTab / loadList 定 -->
<nav class="m-tabbar" id="tabbar" aria-label="看哪一页">
  <a href="#/" data-tab="queue" id="tab-q"><span>待处理</span><i class="dot" id="tab-dot" hidden></i></a>
  <a href="#/progress" data-tab="progress" id="tab-p"><span>进度</span></a>
</nav>

<div class="decide" id="decide" hidden></div>

<!-- 窄屏给结论时从底部弹出的确认面板：意见框、已钉的批注、确认按钮都在这里 -->
<div class="sheet" id="sheet" hidden></div>

<!-- file 证据点开看的那一页：Markdown、文字在这里排好版直接读 -->
<div class="doc" id="doc" hidden role="dialog" aria-modal="true" aria-labelledby="doc-title">
  <div class="doc-bar">
    <button id="doc-close">‹ 回到卡片</button>
    <span id="doc-title"></span>
    <a id="doc-raw" href="#">下载</a>
  </div>
  <div class="doc-body" id="doc-body" tabindex="-1"></div>
  <!-- 读文件的时候就能写：点正文里任意一段写批注；这里是总的意见（和卡片上的意见框是同一份草稿） -->
  <div class="doc-foot" id="doc-foot">
    <div class="doc-foot-in">
      <span class="doc-count" id="doc-count"></span>
      <textarea id="doc-note" rows="1" placeholder="对这份文件总的意见（和卡片上的意见框是同一份，回去还在）"></textarea>
      <button class="btn primary" id="doc-done">读完了，回到卡片</button>
    </div>
  </div>
</div>

<div class="lb" id="lb">
  <div class="bar">
    <span class="cap" id="lb-cap" title="点一下展开 / 收起说明"></span>
  </div>
  <div class="stage" id="lb-stage">
    <div class="wrap" id="lb-wrap"><img id="lb-img" alt="" draggable="false"></div>
  </div>
  <div class="lb-frames" id="lb-frames" hidden>
    <button id="lb-fprev" title="上一帧（←）">‹ 上一帧</button><input type="range" id="lb-range" min="0" max="0" value="0" aria-label="拖动看逐帧"><button id="lb-fnext" title="下一帧（→）">下一帧 ›</button><span class="idx" id="lb-fidx"></span>
  </div>
  <!-- 一组连拍算一张图：← → 在连拍里换帧，换别的图点「上一张图」「下一张图」（2026-11-18） -->
  <div class="tools">
    <button id="lb-prev" title="上一张图">‹ 上一张图</button>
    <button id="lb-pin">📍 在图上批注<kbd>P</kbd></button>
    <button id="lb-zoom" title="放大到原图大小；也可以双指、滚轮、双击">放大</button>
    <button id="lb-close">关闭<kbd>Esc</kbd></button>
    <button id="lb-next" title="下一张图">下一张图 ›</button>
  </div>
</div>

<div class="login" id="login" hidden>
  <form class="login-box" id="login-form">
    <div class="login-brand"><span class="mark" aria-hidden="true">✓</span><h2>审核中心</h2></div>
    <input type="text" name="username" value="审核中心" autocomplete="username" class="sr-only" tabindex="-1" aria-hidden="true">
    <div class="login-lab"><label for="login-pw">密码</label><span id="login-info" role="img" title="输入密码登录。登录一次，这台设备 30 天内不用再输。" aria-label="输入密码登录。登录一次，这台设备 30 天内不用再输。"></span></div>
    <div class="pw-wrap">
      <input type="password" id="login-pw" name="password" autocomplete="current-password" required>
      <button type="button" class="pw-eye" id="pw-eye" aria-label="显示密码" title="显示密码"></button>
    </div>
    <button class="btn primary" type="submit" id="login-go">登录</button>
    <div class="login-err" id="login-err" role="alert"></div>
  </form>
</div>

<div class="tip-pop" id="tip-pop" role="tooltip" hidden></div>
<div class="toast" id="toast"></div>
<!-- 作品集演示版改动：下面一行加了 mock.js（把读写服务器换成内存里的 8 张示例卡）；style.css、app.js 去掉了开头的 / ，好放在子路径下 -->
<script src="mock.js"></script>
<script src="app.js"></script>
</body>
</html>
