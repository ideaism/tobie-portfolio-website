<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>分享卡片 1200 × 630</title>
<!-- 链接被分享到飞书、LinkedIn、iMessage 等时显示的缩略图。
     只用网站已有的元素：品牌点、首页标题、自画像。不写身份（设计师 / 产品经理），身份行改了也不用重做。
     出图：python3 tools/share_card.py  →  dist/assets/share-zh.jpg、share-en.jpg -->
<style>
@font-face{font-family:'AHN';src:url(../dist/assets/fonts/AtkinsonHyperlegibleNext-latin.woff2) format('woff2');font-weight:200 800}
@font-face{font-family:'AHM';src:url(../dist/assets/fonts/AtkinsonHyperlegibleMono-latin.woff2) format('woff2');font-weight:200 800}
html,body{margin:0}
body{width:1200px;height:630px;box-sizing:border-box;overflow:hidden;background:#ECF0ED;color:#0E2A27;
 font-family:'AHN','PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif;
 display:grid;grid-template-columns:1fr 400px;gap:64px;align-items:center;padding:0 76px}
.brand{display:flex;align-items:center;gap:14px;font-size:34px;font-weight:800}
.brand i{width:22px;height:22px;border-radius:50%;background:#F7775F;border:3px solid #0E2A27}
.brand span{font-family:'AHM','PingFang SC','Microsoft YaHei',monospace;font-size:19px;font-weight:400;color:#566A63;letter-spacing:.04em;margin-left:6px}
h1{margin:40px 0 0;font-weight:800;line-height:1.2;letter-spacing:-.01em;font-size:62px}
h1 em{font-style:normal;color:#086D70}
.en h1{font-size:66px;line-height:1.1}
.url{margin-top:44px;font-family:'AHM','PingFang SC','Microsoft YaHei',monospace;font-size:24px;color:#44605B}
.label{display:flex;align-items:center;gap:9px;margin-bottom:10px;font-family:'AHM','PingFang SC','Microsoft YaHei',monospace;font-size:15px;color:#566A63}
.label i{width:9px;height:9px;border-radius:2px;background:#F7775F}
.frame{background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 1px 2px rgba(14,42,39,.08),0 14px 36px rgba(14,42,39,.12)}
.frame img{display:block;width:400px;height:400px}
</style>
</head>
<body>
<div>
 <div class="brand"><i></i>Tobie<span>Yucheng Feng · 冯渝程</span></div>
 <h1 id="title">把复杂的系统，<br>设计得<em>让人看得懂。</em></h1>
 <div class="url">www.tobiefeng.com</div>
</div>
<div>
 <div class="label"><i></i><span id="label">自画像.png — 已标注</span></div>
 <div class="frame"><img src="../dist/assets/work/tobie/avatar.webp" alt=""></div>
</div>
<script>
if (new URLSearchParams(location.search).get('lang') === 'en') {
  document.documentElement.lang = 'en';
  document.body.className = 'en';
  document.getElementById('title').innerHTML = 'I make complex systems <em>understandable.</em>';
  document.getElementById('label').textContent = 'self-portrait.png — annotated';
}
</script>
</body>
</html>
